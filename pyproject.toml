[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drm-display"
version = "0.1.10"
description = "Python bindings for Linux DRM/KMS display output via /dev/dri/cardN"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
# Two entries, not one {name, email} pair: setuptools maps a pair to
# Author-email alone and leaves the legacy Author header unset, so anything
# reading Author (pypistats, some mirrors) reports "None".
authors = [
    { name = "Carsten Bund" },
    { email = "carstenbund@gmail.com" },
]
dependencies = ["numpy"]
keywords = ["drm", "kms", "display", "linux", "framebuffer", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
]

[project.scripts]
drm-list-modes = "drm_display.list_modes:main"

[project.urls]
Homepage = "https://github.com/carstenbund/drm_display"
Repository = "https://github.com/carstenbund/drm_display"

[tool.setuptools.packages.find]
where = ["."]
include = ["drm_display*"]

[tool.setuptools.package-data]
drm_display = ["*.so", "*.c"]
